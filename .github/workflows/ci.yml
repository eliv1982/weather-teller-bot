name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the whitespace check below diffs the whole pushed / PR range.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          # Same major.minor as the production image (python:3.12-slim in the Dockerfile).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies are consistent
        run: python -m pip check

      - name: Compile sources
        run: python -m compileall -q . -x "venv|\.git"

      - name: Whitespace check on the changed lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          empty_tree=$(git hash-object -t tree /dev/null)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Everything the PR adds on top of its merge base with the target branch.
            head="$PR_HEAD_SHA"
            base=$(git merge-base "$PR_BASE_SHA" "$head")
          else
            # Everything the push adds: the previous tip of the branch up to the new tip.
            head="$PUSH_AFTER_SHA"
            base="$PUSH_BEFORE_SHA"
            if [ "${base//0/}" = "" ]; then
              echo "New branch: checking the whole tree."
              base="$empty_tree"
            elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "Previous tip $base is not available (force push?): checking the last commit only."
              base=$(git rev-parse --verify -q "$head^" || echo "$empty_tree")
            fi
          fi
          echo "Checking whitespace in $base..$head"
          git diff --check "$base" "$head"

      # No secrets, no database and no network are needed: the suite mocks Telegram, OpenWeather,
      # Open-Meteo and OpenAI, and covers persistence with mocks and in-memory SQLite.
      - name: Run tests
        run: python -m pytest -q
